[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; 放在反向代理的后面，如 caddy, nginx
; proxy_mode = True

db_host = postgres
db_port = 5432
db_user = odoo
db_password = <password>
db_name = odoo

; 控制是否允许用户通过 Web 界面查看数据库列表、访问数据库管理入口
list_db = False

; 控制 Odoo 根据什么规则筛选可供当前 HTTP 请求使用的数据库
dbfilter = ^odoo
....
