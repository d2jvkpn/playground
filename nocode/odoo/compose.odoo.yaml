networks:
  net: {name: odoo, driver: bridge, external: false}

secrets:
  odoo_pg:
    file: odoo_pg.pass

services:
  odoo:
    image: odoo:19
    container_name: odoo
    #depends_on: ["postgres"]
    restart: always
    networks:
      net: { aliases: ["odoo.svc"] }
    ports: ["127.0.0.1:8069:8069"]
    #secrets: ["odoo_pg"]
    volumes:
    - ./data/odoo-web:/var/lib/odoo # chown -R 100:101 ./data/odoo-web
    - ./data/odoo-extra-addons:/mnt/extra-addons
    - ./data/odoo-config:/etc/odoo
    environment:
      HOST: odoo-postgres.svc
      USER: odoo
      PASSWORD: odoo
      #PASSWORD_FILE: /run/secrets/odoo_pg.pass
    command: ["odoo", "server", "--http-interface=0.0.0.0", "--http-port=8069"]
