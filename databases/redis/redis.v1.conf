# path: /data/redis.conf

## RDB(redis database) configuration
bind        0.0.0.0
port        6379
daemonize   no
dir         /data
dbfilename  dump.rdb
save        60 1000

requirepass  "${PASSWORD}"
#aclfile      /data/users.acl

#logfile  /data/redis.log
logfile   ""
loglevel  notice

## AOF(append only file) configuration
appendonly      yes
appendfsync     everysec
appendfilename  "appendonly.aof"
appenddirname   "appendonlydir"

## AOF + RDB configuration
aof-use-rdb-preamble         yes
auto-aof-rewrite-percentage  100
auto-aof-rewrite-min-size    64mb

proto-max-bulk-len    32mb
io-threads            4
#io-threads-do-reads  yes

## Security
rename-command FLUSHALL ""
rename-command FLUSHDB ""

## Others
# maxmemory 2gb
# maxmemory-policy noeviction # cache: allkeys-lru, allkeys-lfu, noeviction: queue
# tcp-keepalive 300
# timeout 0
# latency-monitor-threshold 100
