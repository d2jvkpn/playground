networks:
  net: { name: "postgres", driver: "bridge", external: false }

# volumes:
#   data: { name: postgres, driver: local }

secrets:
  pg.pass: { file: configs/pg.pass }

services:
  postgres:
    #image: q.local/postgres:18-trixie
    image: postgres:18-trixie
    container_name: postgres
    restart: always
    shm_size: 512m # df -h | grep shm
    healthcheck:
      test: pg_isready --username postgres --dbname postgres
      start_period: 15s
      interval: 15s
      timeout: 3s
      retries: 3
    #user: postgres:postgres
    secrets: ["pg.pass"]
    #network_mode: bridge
    networks:
      net:
        aliases: [postgres.svc]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
    - ./data/share:/mnt/share
    - ./data/postgres:/var/lib/postgresql/18/docker
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      #POSTGRES_PASSWORD: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg.pass
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    command:
    - postgres
    - -c
    - work_mem=16MB
    - -c
    - shared_buffers=1GB
    - -c
    - max_connections=200
    #- "-c"
    #- "config_file=/etc/postgresql/postgresql.conf
