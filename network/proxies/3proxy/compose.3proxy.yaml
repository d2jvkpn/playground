networks:
  net: { name: local, external: true }

services:
  3proxy:
    image: ghcr.io/3proxy/3proxy:latest
    container_name: 3proxy
    restart: always
    security_opt: ["no-new-privileges:true"]
    read_only: true
    #network_mode: host
    networks: ["net"]
    ports:
    - "100.x.x.x:1080:1080/tcp"
    - "100.x.x.x:1081:1081/tcp"
    volumes:
    - ./configs/3proxy.cfg:/etc/3proxy/3proxy.cfg:ro
