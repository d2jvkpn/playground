# 日志输出到 systemd journal
logoutput: /opt/logs/dante-server.log

# 入口：Tailscale
internal: 100.101.102.103 port = 1080

# 出口：公网网卡
external: eth0

# 服务运行身份
user.privileged: root
user.notprivileged: nobody

# 无用户名密码认证
clientmethod: none
socksmethod: none

# 只允许指定客户端
client pass {
    from: 100.101.102.104/32 to: 0.0.0.0/0
    log: error connect disconnect
}

# 拒绝其他客户端（默认也会拒绝）
client block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# 阻止通过代理访问本机及内网地址
socks block {
    from: 0.0.0.0/0 to: 127.0.0.0/8
    log: error
}

socks block {
    from: 0.0.0.0/0 to: 10.0.0.0/8
    log: error
}

socks block {
    from: 0.0.0.0/0 to: 172.16.0.0/12
    log: error
}

socks block {
    from: 0.0.0.0/0 to: 192.168.0.0/16
    log: error
}

socks block {
    from: 0.0.0.0/0 to: 100.64.0.0/10
    log: error
}

socks block {
    from: 0.0.0.0/0 to: 169.254.0.0/16
    log: error
}

# 允许 TCP CONNECT
socks pass {
    from: 100.101.102.104/32 to: 0.0.0.0/0
    command: connect
    log: error connect disconnect
}
