## 允许已有连接的返回流量，拒绝指定来源网段的其他入站流量。
PostUp = iptables -I INPUT 1 -i %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostUp = iptables -I INPUT 2 -i %i -s 10.1.1.0/24 -j DROP
PostDown = iptables -D INPUT -i %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostDown = iptables -D INPUT -i %i -s 10.1.1.0/24 -j DROP

## 拒绝 WireGuard 接口上所有被识别为 NEW 的入站流量，不限制来源 IP。
PostUp = iptables -A INPUT -i wg0 -m conntrack --ctstate NEW -j DROP
PostDown = iptables -D INPUT -i wg0 -m conntrack --ctstate NEW -j DROP


## 允许 10.1.10.10/32 互相访问，拒绝其他全部入口、出口流量
PostUp = iptables -I INPUT 1 -i %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostUp = iptables -I INPUT 2 -i %i -s 10.1.10.10/32 -j ACCEPT
PostUp = iptables -I INPUT 3 -i %i -j DROP
PostDown = iptables -D INPUT -i %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostDown = iptables -D INPUT -i %i -s 10.1.10.10/32 -j ACCEPT
PostDown = iptables -D INPUT -i %i -j DROP

## 允许 10.1.10.10/32 互相访问，拒绝其他全部入口连接流量
PostUp = iptables -I INPUT 1 -i %i -s 10.1.10.10/32 -j ACCEPT
PostUp = iptables -I INPUT 2 -i %i -m conntrack --ctstate NEW -j DROP
PostDown = iptables -D INPUT -i %i -s 10.1.10.10/32 -j ACCEPT
PostDown = iptables -D INPUT -i %i -m conntrack --ctstate NEW -j DROP
